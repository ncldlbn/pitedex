<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accedi · PìteDex</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/pitedex_favicon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-page">
        <div class="card card-form login-card">
            <img src="{{ url_for('static', filename='img/pitedex_title.png') }}" alt="PìteDex" class="login-logo">
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                <ul class="flash">{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>
                {% endif %}
            {% endwith %}
            <form method="post">
                <label>Utente
                    <input type="text" name="username" required autofocus>
                </label>
                <label>Password
                    <input type="password" name="password" required>
                </label>
                <button type="submit">Accedi</button>
            </form>
        </div>
    </div>
</body>
</html>
