{% extends "base.html" %}
{% block content %}
<h1 class="page-title">Razze</h1>

<div class="card">
    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for r in razze %}
            <tr>
                <td>{{ r.nome }}</td>
                <td>
                    <a href="{{ url_for('razza_modifica', razza_id=r.id) }}">Modifica</a>
                    ·
                    <form method="post" action="{{ url_for('razza_elimina', razza_id=r.id) }}" class="form-inline" onsubmit="return confirm('Eliminare la razza {{ r.nome }}? L\'operazione non è reversibile.');">
                        <button type="submit" class="link-button">Elimina</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="2" class="empty">Nessuna razza configurata.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<p style="margin-top: 1.25rem;">
    <a class="button-link" href="{{ url_for('razza_nuova') }}">+ Nuova razza</a>
</p>
{% endblock %}
