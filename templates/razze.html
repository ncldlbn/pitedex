{% extends "base.html" %}
{% block content %}
<h1 class="page-title">Impostazioni</h1>

<h2 class="section-title">Visualizzazione</h2>
<div class="card card-form" style="margin-bottom: 2rem;">
    <form method="post" action="{{ url_for('impostazioni_vista_salva') }}">
        <label>Colonne su mobile
            <input type="number" name="colonne_mobile" min="1" max="4" value="{{ vista.colonne_mobile }}" required>
        </label>
        <label>Colonne su desktop
            <input type="number" name="colonne_desktop" min="1" max="4" value="{{ vista.colonne_desktop }}" required>
        </label>
        <label>Ordine predefinito delle schede
            <select name="ordine">
                {% for k, v in ordine_opzioni.items() %}
                <option value="{{ k }}" {{ 'selected' if vista.ordine == k else '' }}>{{ v }}</option>
                {% endfor %}
            </select>
        </label>
        <button type="submit">Salva</button>
    </form>
</div>

<h2 class="section-title">Razze</h2>
<div class="card">
    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for r in razze %}
            <tr>
                <td>{{ r.nome }}</td>
                <td>
                    <a href="{{ url_for('razza_modifica', razza_id=r.id) }}">Modifica</a>
                    ·
                    <form method="post" action="{{ url_for('razza_elimina', razza_id=r.id) }}" class="form-inline" onsubmit="return confirm('Eliminare la razza {{ r.nome }}? L\'operazione non è reversibile.');">
                        <button type="submit" class="link-button">Elimina</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="2" class="empty">Nessuna razza configurata.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<p style="margin-top: 1.25rem;">
    <a class="button-link" href="{{ url_for('razza_nuova') }}">+ Nuova razza</a>
</p>
{% endblock %}
