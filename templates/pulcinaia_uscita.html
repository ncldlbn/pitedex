{% extends "base.html" %}
{% block content %}
<h1 class="page-title">Uscita da Pulcinaia</h1>
<p class="hint" style="margin: -0.75rem 0 1.25rem;">{{ lotto.razza_nome }} · {{ lotto.eta_mesi_attuale }} mesi ({{ lotto.classe_eta }}) · {{ lotto.numero_capi_attuale }} disponibili</p>

<div class="card card-form">
<form method="post">
    <label>Tipo
        <select name="tipo" id="tipo" required>
            {% for k, v in tipi.items() %}<option value="{{ k }}">{{ v }}</option>{% endfor %}
        </select>
    </label>
    <label>Numero pulcini
        <input type="number" name="numero_capi" id="numero_capi" value="1" min="1" max="{{ lotto.numero_capi_attuale }}" required>
    </label>
    <label id="sesso-label">Sesso (ora determinabile)
        <select name="sesso" id="sesso">
            <option value="F">Femmina</option>
            <option value="M">Maschio</option>
        </select>
    </label>
    <label id="destinazione-label">Destinazione d'uso
        <select name="destinazione" id="destinazione">
            {% for k, v in destinazioni.items() %}<option value="{{ k }}">{{ v }}</option>{% endfor %}
        </select>
    </label>
    <label id="prezzo-label">Prezzo di vendita totale (€)
        <input type="number" name="prezzo_vendita" id="prezzo_vendita" step="0.01" min="0">
    </label>
    <button type="submit">Registra</button>
</form>
<script>
    const tipoSelect = document.getElementById("tipo");
    const sessoLabel = document.getElementById("sesso-label");
    const destinazioneLabel = document.getElementById("destinazione-label");
    const prezzoLabel = document.getElementById("prezzo-label");
    const sesso = document.getElementById("sesso");
    const destinazione = document.getElementById("destinazione");
    const prezzo = document.getElementById("prezzo_vendita");

    function aggiorna() {
        const promozione = tipoSelect.value === "promozione";
        const vendita = tipoSelect.value === "vendita";

        sessoLabel.style.display = promozione ? "" : "none";
        destinazioneLabel.style.display = promozione ? "" : "none";
        sesso.required = promozione;
        destinazione.required = promozione;

        prezzoLabel.style.display = vendita ? "" : "none";
        prezzo.required = vendita;
    }

    tipoSelect.addEventListener("change", aggiorna);
    aggiorna();
</script>
</div>
{% endblock %}
