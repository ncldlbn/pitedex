<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PiteDex{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/pitedex_favicon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="navbar">
        <a href="{{ url_for('index') }}" class="navbar-brand">
            <img src="{{ url_for('static', filename='img/pitedex_title.png') }}" alt="Pitedex" class="navbar-title-img">
        </a>
        <div class="navbar-azioni">
            <a href="{{ url_for('log_attivita') }}" class="navbar-icona-link {{ 'active' if request.endpoint == 'log_attivita' else '' }}" title="Log attività" aria-label="Log attività">📜</a>
            <a href="{{ url_for('razze_lista') }}" class="navbar-icona-link {{ 'active' if request.endpoint in ['razze_lista', 'razza_nuova', 'razza_modifica'] else '' }}" title="Impostazioni" aria-label="Impostazioni">⚙️</a>
            <a href="{{ url_for('logout') }}" class="navbar-icona-link" title="Esci" aria-label="Esci">🚪</a>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <nav>
                <a href="{{ url_for('incubazione_lista') }}" class="nav-link {{ 'active' if request.endpoint == 'incubazione_lista' else '' }}">
                    <span class="nav-icon" aria-hidden="true">🐣</span> Incubazione
                </a>
                <a href="{{ url_for('pulcinaia_lista') }}" class="nav-link {{ 'active' if request.endpoint == 'pulcinaia_lista' else '' }}">
                    <span class="nav-icon" aria-hidden="true">🐤</span> Pulcinaia
                </a>
                <a href="{{ url_for('pollaio_lista') }}" class="nav-link {{ 'active' if request.endpoint == 'pollaio_lista' else '' }}">
                    <span class="nav-icon" aria-hidden="true">🐔</span> Pollaio
                </a>
                <a href="{{ url_for('registro_uova_lista') }}" class="nav-link {{ 'active' if request.endpoint in ['registro_uova_lista', 'registro_uova_raccolta', 'registro_uova_vendita'] else '' }}">
                    <span class="nav-icon" aria-hidden="true">🥚</span> Uova
                </a>

                <div class="nav-separator" role="separator"></div>

                <a href="{{ url_for('bilancio') }}" class="nav-link {{ 'active' if request.endpoint == 'bilancio' else '' }}">
                    <span class="nav-icon" aria-hidden="true">💶</span> Bilancio
                </a>
                <a href="{{ url_for('proiezioni') }}" class="nav-link {{ 'active' if request.endpoint == 'proiezioni' else '' }}">
                    <span class="nav-icon" aria-hidden="true">📈</span> Proiezioni
                </a>
            </nav>
        </aside>

        <main class="content">
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <ul class="flash">
                        {% for m in messages %}<li>{{ m }}</li>{% endfor %}
                    </ul>
                {% endif %}
            {% endwith %}
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
