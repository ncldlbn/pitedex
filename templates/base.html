<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PiteDex{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/pitedex_favicon.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#1e3a2b">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="navbar">
        <a href="{{ url_for('index') }}" class="navbar-brand">
            <img src="{{ url_for('static', filename='img/pitedex_title.png') }}" alt="Pitedex" class="navbar-title-img">
        </a>
        <div class="navbar-azioni">
            <a href="{{ url_for('log_attivita') }}" class="navbar-icona-link {{ 'active' if request.endpoint == 'log_attivita' else '' }}" title="Log attività" aria-label="Log attività">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="8" y1="18" x2="20" y2="18"/><line x1="4" y1="6" x2="4.01" y2="6"/><line x1="4" y1="12" x2="4.01" y2="12"/><line x1="4" y1="18" x2="4.01" y2="18"/></svg>
            </a>
            <a href="{{ url_for('manuale') }}" class="navbar-icona-link {{ 'active' if request.endpoint == 'manuale' else '' }}" title="Manuale" aria-label="Manuale">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </a>
            <a href="{{ url_for('razze_lista') }}" class="navbar-icona-link {{ 'active' if request.endpoint in ['razze_lista', 'razza_nuova', 'razza_modifica'] else '' }}" title="Impostazioni" aria-label="Impostazioni">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
            </a>
            <a href="{{ url_for('logout') }}" class="navbar-icona-link" title="Esci" aria-label="Esci">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </a>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <nav>
                <a href="{{ url_for('bilancio') }}" class="nav-link {{ 'active' if request.endpoint == 'bilancio' else '' }}">
                    <span class="nav-icon" aria-hidden="true">💶</span> Bilancio
                </a>
                <a href="{{ url_for('statistiche') }}" class="nav-link {{ 'active' if request.endpoint == 'statistiche' else '' }}">
                    <span class="nav-icon" aria-hidden="true">📊</span> Statistiche
                </a>
                <a href="{{ url_for('proiezioni') }}" class="nav-link {{ 'active' if request.endpoint == 'proiezioni' else '' }}">
                    <span class="nav-icon" aria-hidden="true">📈</span> Proiezioni
                </a>
            </nav>
        </aside>

        <main class="content">
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <ul class="flash">
                        {% for m in messages %}<li>{{ m }}</li>{% endfor %}
                    </ul>
                {% endif %}
            {% endwith %}
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
