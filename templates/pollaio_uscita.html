{% extends "base.html" %}
{% import "_macros.html" as macros %}
{% block content %}
{% call macros.form_page("Uscita da Pollaio") %}
    <input type="hidden" name="razza_id" id="gruppo-razza-id">
    <input type="hidden" name="sesso" id="gruppo-sesso">
    <input type="hidden" name="anno_nascita" id="gruppo-anno-nascita">
    <input type="hidden" name="destinazione" id="gruppo-destinazione">
    <label>Tipo
        <select name="tipo" id="tipo-select" required>
            {% for k, v in tipi.items() %}<option value="{{ k }}">{{ v }}</option>{% endfor %}
        </select>
    </label>
    <label>Razza
        <select id="gruppo-select-razza"></select>
    </label>
    <label>Sesso
        <select id="gruppo-select-sesso"></select>
    </label>
    <label>Nati nel
        <select id="gruppo-select-anno"></select>
    </label>
    <label id="destinazione-label">Destinazione d'uso
        <select id="gruppo-select-destinazione"></select>
    </label>
    <label>Numero capi
        <span class="campo-con-badge">
            <input type="number" name="numero_capi" id="gruppo-numero" value="1" min="1" required>
            <span class="badge" id="gruppo-disponibili-hint"></span>
        </span>
    </label>
    <label id="prezzo-label">Prezzo di vendita totale (€)
        <input type="number" name="prezzo_vendita" step="0.01" min="0">
    </label>
    <button type="submit">Registra</button>
{% endcall %}
<script src="{{ url_for('static', filename='pollaio-cascata.js') }}"></script>
<script>
    const GRUPPI_POLLAIO = {{ gruppi_pollaio|tojson }};
    const DESTINAZIONE_LABEL = {{ destinazioni|tojson }};
    const DESTINAZIONE_PER_TIPO = { vendita: "rivendita", macellazione: "carne" };

    const tipoSelect = document.getElementById("tipo-select");
    const destinazioneLabel = document.getElementById("destinazione-label");
    const prezzoLabel = document.getElementById("prezzo-label");
    const destinazioneHidden = document.getElementById("gruppo-destinazione");

    function aggiornaTipo() {
        const tipo = tipoSelect.value;
        const fissa = DESTINAZIONE_PER_TIPO[tipo] || null;
        const conDestinazione = !fissa;

        destinazioneLabel.style.display = conDestinazione ? "" : "none";
        prezzoLabel.style.display = tipo === "vendita" ? "" : "none";

        const righe = fissa ? GRUPPI_POLLAIO.filter(r => r.destinazione === fissa) : GRUPPI_POLLAIO;
        initCascataGruppo("gruppo", righe, conDestinazione, DESTINAZIONE_LABEL);
        if (fissa) destinazioneHidden.value = fissa;
    }

    tipoSelect.addEventListener("change", aggiornaTipo);
    aggiornaTipo();
</script>
{% endblock %}
