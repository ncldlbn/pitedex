{% extends "base.html" %}
{% import "_macros.html" as macros %}
{% block content %}
<h1 class="page-title">🐤 Pulcinaia</h1>
{{ macros.controlli_vista(vista) }}

<div class="box-grid">
    {% for g in gruppi %}
    <div class="card" data-totale="{{ g.totale_capi }}" data-nome="{{ g.razza }}">
        <div class="card-header">
            <span class="razza-name">{{ g.razza }}</span>
            <span class="razza-total razza-total-evidente">{{ g.totale_capi }} pulcini</span>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
