{% extends "base.html" %}
{% block content %}
<h1 class="page-title">📊 Statistiche</h1>
<h2 class="section-title">Popolazione del Pollaio nel tempo</h2>

<div class="grafico-legenda" id="selettore-razze">
    {% for s in andamento_razze %}
    <label class="legenda-voce legenda-selezionabile">
        <input type="checkbox" checked data-razza="{{ s.razza }}">
        <span class="legenda-chiave" style="background: {{ s.colore }};"></span>
        {{ s.razza }}
    </label>
    {% else %}
    <p class="hint">Nessun dato disponibile.</p>
    {% endfor %}
</div>

<div class="card">
    <div id="grafico-popolazione-razze" class="grafico-contenitore"></div>
</div>

<script src="{{ url_for('static', filename='statistiche.js') }}"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const serie = {{ andamento_razze|tojson }};
        const selettore = document.getElementById("selettore-razze");
        const contenitore = document.getElementById("grafico-popolazione-razze");
        if (!contenitore) return;

        function disegna() {
            const attive = Array.from(selettore.querySelectorAll("input:checked")).map(cb => cb.dataset.razza);
            renderStackedAreaChart(contenitore, serie.filter(s => attive.includes(s.razza)), { suffisso: " capi" });
        }

        selettore.querySelectorAll("input").forEach(cb => cb.addEventListener("change", disegna));
        disegna();
    });
</script>
{% endblock %}
